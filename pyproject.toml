[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scoutrag"
version = "1.0.1"
description = "Evidence-based, multi-stage retrieval architecture for football scouting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ScoutRAG Contributors" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "pyarrow>=17,<23",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
scoutrag-data = "scoutrag.data.cli:main"
scoutrag-evaluate = "scoutrag.evaluation.cli:main"
scoutrag-govern = "scoutrag.governance.cli:main"
scoutrag-govern-evaluate = "scoutrag.evaluation.governance_cli:main"
scoutrag-rerank-evaluate = "scoutrag.evaluation.reranking_cli:main"
scoutrag-retrieve = "scoutrag.retrieval.cli:main"
scoutrag-bi-encoder = "scoutrag.training.cli:main"
scoutrag-answer-evaluate = "scoutrag.evaluation.answer_grounding_cli:main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "mypy>=1.11,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]
retrieval = [
    "sentence-transformers>=5.6,<6.0",
]
onnx = [
    "sentence-transformers[onnx]>=5.6,<6.0",
]
training = [
    "accelerate>=1.10,<2.0",
    "datasets>=4.0,<5.0",
    "sentence-transformers>=5.6,<6.0",
]
llm = [
    "openai>=2.0,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scoutrag"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["scoutrag"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["scoutrag"]
