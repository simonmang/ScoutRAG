name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov=scoutrag --cov-report=term-missing

  container:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build portfolio image
        run: docker build --tag scoutrag:ci .

      - name: Start portfolio image
        run: docker run --detach --name scoutrag-demo --publish 8000:8000 scoutrag:ci

      - name: Verify health, dashboard, and retrieval
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs scoutrag-demo
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ | grep "Recommendation Evidence Pack"
          curl --fail --silent \
            --header "Content-Type: application/json" \
            --data '{"query":"Show the profile of Alex Musterfeld","result_count":3}' \
            http://127.0.0.1:8000/api/v1/retrieve | grep "Alex Musterfeld"

      - name: Show container logs on failure
        if: failure()
        run: docker logs scoutrag-demo
